# Developer entry point for the alembic command; the application itself builds its Alembic config in rapidwire/db/migrate.py.
# The database URL comes from the RAPIDWIRE_DB_* settings unless sqlalchemy.url is set below.

[alembic]
script_location = %(here)s/rapidwire/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
