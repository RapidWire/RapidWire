[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rapidwire-client"
dynamic = ["version"]
description = "Python client of the RapidWire /v1 HTTP API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[tool.setuptools.dynamic]
version = { attr = "rapidwire_client._version.__version__" }

[tool.setuptools.packages.find]
include = ["rapidwire_client*"]

[tool.setuptools.package-data]
rapidwire_client = ["py.typed"]
