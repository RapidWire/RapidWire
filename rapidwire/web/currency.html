<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="RapidWireの通貨の詳細と移動履歴">
<title>Currency - RapidWire</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/currency.js"></script>
</head>
<body>
<a class="skip-link" href="#main">本文へスキップ</a>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="/"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M2 20h8l4-8h6l4 8h6" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><circle cx="14" cy="12" r="3" fill="currentColor"/><circle cx="24" cy="20" r="3" fill="currentColor"/></svg>RapidWire</a>
    <nav class="site-nav" aria-label="メイン">
      <ul>
        <li><a href="/">Top</a></li>
        <li><a href="/explorer.html">Explorer</a></li>
        <li><a href="/pools.html">Pools</a></li>
      </ul>
    </nav>
    <form class="header-search" action="/explorer.html" method="get" role="search">
      <label class="visually-hidden" for="site-search">ID または通貨シンボルで検索</label>
      <input type="search" id="site-search" name="q" placeholder="ID / 通貨シンボル" autocomplete="off" spellcheck="false" maxlength="40">
      <button class="btn btn--primary" type="submit">検索</button>
    </form>
  </div>
</header>

<main id="main" class="site-main">
  <div class="page-head">
    <p class="page-id" id="currency-id">通貨</p>
    <h1 id="currency-title">通貨</h1>
    <div class="cluster head-badges" id="currency-badges"></div>
  </div>

  <div id="currency-error"></div>
  <div id="currency-banner"></div>

  <div id="currency-body" hidden>
    <section class="panel" aria-labelledby="details-title">
      <div class="panel-head">
        <h2 id="details-title">通貨の詳細</h2>
      </div>
      <div id="details"></div>
    </section>

    <section class="panel" aria-labelledby="history-title">
      <div class="panel-head">
        <h2 id="history-title">移動履歴</h2>
        <p class="panel-note" id="history-summary"></p>
      </div>
      <form class="filters" id="history-filter" action="/currency.html" method="get">
        <div class="field">
          <label for="history-sort">並び替え</label>
          <select id="history-sort" name="sort_by">
            <option value="transfer_id">移動ID</option>
            <option value="timestamp">時刻</option>
            <option value="amount">金額</option>
          </select>
        </div>
        <div class="field">
          <label for="history-order">順序</label>
          <select id="history-order" name="sort_order">
            <option value="desc">降順</option>
            <option value="asc">昇順</option>
          </select>
        </div>
        <div class="cluster">
          <button class="btn btn--primary" type="submit">表示</button>
        </div>
      </form>
      <div id="history" class="table-host"></div>
      <div id="history-pager"></div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="site-footer-inner">
    <p>RapidWire</p>
    <ul>
      <li><a href="/docs">API docs</a></li>
      <li><a href="/operator.html">Operator</a></li>
    </ul>
  </div>
</footer>
</body>
</html>
